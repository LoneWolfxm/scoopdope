name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/types/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  types-version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes under packages/types
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- packages/types; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if types changed without a version bump
        if: steps.changed.outputs.changed == 'true'
        run: |
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:packages/types/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          HEAD_VERSION=$(node -p "require('./packages/types/package.json').version")
          echo "Base version: $BASE_VERSION"
          echo "Head version: $HEAD_VERSION"
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::packages/types changed but its version was not bumped ($HEAD_VERSION). Bump the version in packages/types/package.json (release-please will do this via a PR) and update packages/types/CHANGELOG.md."
            exit 1
          fi

  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.release.outputs.release_created == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          release_name: Release ${{ steps.release.outputs.version }}
          body: ${{ steps.release.outputs.body }}
          draft: false
          prerelease: false

  tag-docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
