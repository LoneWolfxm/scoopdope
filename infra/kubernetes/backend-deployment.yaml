apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoopdope-backend
  namespace: default
  labels:
    app: scoopdope-backend
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scoopdope-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: scoopdope-backend
        version: v1
    spec:
      serviceAccountName: scoopdope-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        image: scoopdope/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HEALTH_DISK_PATH
          value: "/tmp"
        envFrom:
        - configMapRef:
            name: scoopdope-backend-config
        - secretRef:
            name: scoopdope-backend-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        # Probes use exec + wget against the loopback interface so they are
        # protocol-agnostic: they work whether TLS is terminated in-pod or at
        # the ingress, and never depend on plain HTTP being exposed.
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'wget -q -O /dev/null --no-check-certificate "https://localhost:3000/health/liveness" || wget -q -O /dev/null "http://localhost:3000/health/liveness"'
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'wget -q -O /dev/null --no-check-certificate "https://localhost:3000/health/readiness" || wget -q -O /dev/null "http://localhost:3000/health/readiness"'
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'wget -q -O /dev/null --no-check-certificate "https://localhost:3000/health/startup" || wget -q -O /dev/null "http://localhost:3000/health/startup"'
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - scoopdope-backend
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
